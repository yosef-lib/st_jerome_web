<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - St. Jerome Library Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              boxdark: '#3E2723',
              primary: '#6D4C41',
              danger: '#EF4444',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="bg-boxdark font-sans flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md rounded-sm border border-stroke bg-white shadow-default p-8 md:p-10 text-center animate-[fadeIn_0.3s_ease-out]">
    
    <div class="mb-4 inline-flex items-center justify-center">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="w-24 h-24 rounded-full border-4 border-primary/20 object-cover">
    </div>
    
    <h2 class="mb-2 text-2xl font-bold text-black sm:text-title-xl2">St. Jerome</h2>
    <p class="mb-8 font-medium text-slate-500">Library Assistant & Collection Intelligence</p>

    {% if error %}
    <div class="mb-6 flex w-full border-l-6 border-danger bg-danger/10 px-4 py-3 shadow-md">
        <div class="w-full text-left">
            <h5 class="font-semibold text-danger">{{ error }}</h5>
        </div>
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-4 relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" name="username" placeholder="Username" required autofocus class="w-full rounded border border-stroke bg-transparent py-3 pl-11 pr-4 outline-none transition focus:border-primary active:border-primary">
        </div>

        <div class="mb-6 relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" name="password" placeholder="Password" required class="w-full rounded border border-stroke bg-transparent py-3 pl-11 pr-4 outline-none transition focus:border-primary active:border-primary">
        </div>

        <button type="submit" class="w-full cursor-pointer rounded-lg border border-primary bg-primary p-3 text-white transition hover:bg-opacity-90">
            Masuk
        </button>
    </form>
</div>

</body>
</html>
