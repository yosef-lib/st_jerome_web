<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Peminjaman - St. Jerome Library Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              boxdark: '#3E2723',
              boxdark2: '#4E342E',
              bodydark: '#A1887F',
              bodydark2: '#A1887F',
              primary: '#6D4C41',
              secondary: '#8D6E63',
              stroke: '#E2E8F0',
              danger: '#E53935',
              success: '#43A047',
              warning: '#F57C00',
              'gray-2': '#F8FAFC',
              cream: '#F5E6E6'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5E6E6; } /* Warna bg pink/cream seperti di screenshot */
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative" x-data="kioskApp()" @click="focusInput()">
    
    <!-- Pattern Background -->
    <div class="fixed inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#6D4C41 1px, transparent 1px); background-size: 24px 24px;"></div>
    
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[600px] relative z-10">
        
        <!-- Kiri: Informasi (Coklat) -->
        <div class="w-full md:w-5/12 bg-boxdark text-white p-10 flex flex-col relative overflow-hidden">
            <!-- Dekorasi background -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 rounded-full bg-white/5 blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-48 h-48 rounded-full bg-white/5 blur-2xl pointer-events-none"></div>
            
            <div class="relative z-10 flex flex-col items-center text-center mt-4">
                <div class="w-28 h-28 bg-white rounded-full flex items-center justify-center mb-6 shadow-lg border-4 border-primary mx-auto overflow-hidden">
                    <img src="{{ url_for('static', filename='img/logo_imavi.png') }}" onerror="this.src='{{ url_for('static', filename='img/logo.jpg') }}'" alt="IMAVI Logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-3xl font-bold mb-4 leading-tight tracking-tight">Cek<br>Peminjaman<br>St. Jerome</h1>
                <p class="text-bodydark text-sm mb-8 font-medium px-4">Silakan pindai Kartu Anggota Anda untuk melihat status peminjaman dan peringatan denda.</p>
            </div>
            <div class="mt-auto relative z-10 flex items-center justify-start gap-3 border-t border-bodydark/30 pt-4">
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/20 shrink-0">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" onerror="this.src='{{ url_for('static', filename='img/logo.jpg') }}'" alt="SJLA" class="w-full h-full object-cover">
                </div>
                <div class="text-left">
                    <p class="text-sm font-bold text-white tracking-wide">ST. JEROME</p>
                    <p class="text-xs text-bodydark font-medium">Library Assistant</p>
                </div>
            </div>
        </div>
        
        <!-- Kanan: Form Scan (Putih) -->
        <div class="w-full md:w-7/12 p-10 relative flex flex-col">
            <div class="flex-1 flex flex-col justify-center items-center px-4 md:px-12">
                <div class="w-full text-center">
                    <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6 text-primary">
                        <i class="fa-solid fa-barcode text-3xl"></i>
                    </div>
                    
                    <h2 class="text-3xl font-bold text-boxdark mb-3">Scan Barcode Anda</h2>
                    <p class="text-bodydark font-medium mb-10">Gunakan scanner fisik di meja untuk memindai kartu anggota Anda.</p>
                    
                    <form @submit.prevent="checkMember" class="w-full">
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none transition-colors group-focus-within:text-primary text-slate-400">
                                <i class="fa-solid fa-barcode text-xl"></i>
                            </div>
                            <input 
                                type="text" 
                                id="barcodeInput" 
                                x-model="memberId" 
                                class="w-full bg-white border-2 border-stroke rounded-xl pl-12 pr-4 py-4 text-center text-xl font-bold text-boxdark focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all shadow-sm placeholder:text-slate-400 placeholder:font-normal placeholder:text-sm"
                                placeholder="Arahkan kursor kesini dan Scan Barcode"
                                autocomplete="off"
                                autofocus
                            >
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading overlay -->
    <div x-show="loading" class="fixed inset-0 bg-boxdark/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm" style="display: none;">
        <i class="fa-solid fa-circle-notch fa-spin text-6xl text-white mb-6"></i>
        <div class="text-2xl font-bold text-white tracking-widest">MEMPROSES KARTU...</div>
    </div>
    
    <script>
        function kioskApp() {
            return {
                memberId: '',
                loading: false,
                
                init() {
                    this.focusInput();
                    // Jaga-jaga kalau input kehilangan fokus
                    setInterval(() => {
                        if(document.activeElement.id !== 'barcodeInput' && !this.loading) {
                            this.focusInput();
                        }
                    }, 2000);
                },
                
                focusInput() {
                    const input = document.getElementById('barcodeInput');
                    if(input) input.focus();
                },
                
                checkMember() {
                    if(!this.memberId.trim()) return;
                    
                    this.loading = true;
                    setTimeout(() => {
                        window.location.href = '/cek_pinjaman/' + encodeURIComponent(this.memberId.trim()) + '?source=kiosk';
                    }, 800); // Fake delay for UX
                }
            }
        }
    </script>
</body>
</html>
