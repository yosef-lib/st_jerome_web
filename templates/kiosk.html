<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kehadiran - Perpustakaan IMAVI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              boxdark: '#3E2723',
              primary: '#6D4C41',
              stroke: '#E2E8F0',
              danger: '#E53935',
              success: '#43A047',
              'gray-2': '#F8FAFC',
              'brand-bg': '#EFEBE9',
              'brand-card': '#FFFFFF',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #795548 0%, #3E2723 100%);
            min-height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom Radio Styling */
        input[type="radio"] {
            display: none;
        }
        input[type="radio"] + label {
            cursor: pointer;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.2s ease-in-out;
        }
        input[type="radio"]:checked + label {
            border-color: #6D4C41;
            background-color: rgba(109, 76, 65, 0.05);
        }
        .radio-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #CBD5E1;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="radio"]:checked + label .radio-circle {
            border-color: #6D4C41;
        }
        input[type="radio"]:checked + label .radio-circle::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #6D4C41;
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex flex-col items-center py-10 px-4 relative">
    
    <!-- Tombol Kembali -->
    <a href="/" class="absolute top-6 left-6 md:top-10 md:left-10 bg-white text-black font-semibold py-2 px-4 rounded shadow hover:bg-gray-50 transition flex items-center gap-2 text-sm z-10">
        <i class="fa-solid fa-arrow-left"></i> Kembali
    </a>
    
    <!-- Success Toast -->
    <div id="successToast" class="fixed inset-0 bg-success/95 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-8xl mb-6 shadow-sm rounded-full bg-white text-success"></i>
        <h2 id="successMessage" class="text-4xl font-bold mb-2 text-center px-4">Selamat Datang!</h2>
        <p class="text-xl opacity-90">Kehadiran Anda telah tercatat.</p>
    </div>

    <!-- Header Section -->
    <div class="w-full max-w-3xl mb-8 flex flex-col items-center text-white">
        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-lg">
            <img src="{{ url_for('static', filename='img/logo_imavi.png') }}" onerror="this.src='{{ url_for('static', filename='img/logo.jpg') }}'" alt="Logo" class="w-10 h-10 object-contain">
        </div>
        <h1 class="text-3xl font-bold mb-1">Form Kehadiran</h1>
        <p class="text-sm opacity-80">Perpustakaan IMAVI</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-3xl bg-brand-bg rounded-2xl p-4 md:p-8 shadow-2xl">
        
        <form id="kioskForm" onsubmit="event.preventDefault(); submitForm();">
            
            <!-- Status Member -->
            <div class="bg-brand-card rounded-xl p-6 shadow-sm mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <i class="fa-solid fa-user text-primary text-xl"></i>
                    <h2 class="text-lg font-bold text-black">Status Member</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <input type="radio" name="statusMember" id="bukanMember" value="Non-Member" checked onchange="toggleForm()">
                        <label for="bukanMember">
                            <div class="radio-circle"></div>
                            <div>
                                <div class="font-bold text-black text-sm">Bukan Member</div>
                                <div class="text-xs text-slate-500">Pengunjung umum</div>
                            </div>
                        </label>
                    </div>
                    <div>
                        <input type="radio" name="statusMember" id="adalahMember" value="Member" onchange="toggleForm()">
                        <label for="adalahMember">
                            <div class="radio-circle"></div>
                            <div>
                                <div class="font-bold text-black text-sm">Member</div>
                                <div class="text-xs text-slate-500">Anggota perpustakaan</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Data Pengunjung -->
            <div class="bg-brand-card rounded-xl p-6 shadow-sm mb-6">
                <div class="flex items-center gap-3 mb-6">
                    <i class="fa-solid fa-user-check text-success text-xl"></i>
                    <h2 class="text-lg font-bold text-black">Data Pengunjung</h2>
                </div>
                
                <!-- View: Bukan Member -->
                <div id="viewBukanMember" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    
                    <div class="relative md:col-span-1">
                        <label class="mb-2 block text-sm font-semibold text-slate-600">Nama Lengkap</label>
                        <input type="text" id="tamuNama" autocomplete="off" placeholder="Masukkan nama lengkap" class="w-full rounded-lg border border-stroke bg-transparent py-3 px-4 outline-none transition focus:border-primary">
                        
                        <div id="autocompleteList" class="absolute z-40 w-full bg-white border border-stroke rounded-lg mt-1 shadow-lg hidden max-h-48 overflow-y-auto no-scrollbar">
                            <!-- Injected -->
                        </div>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-slate-600">Instansi</label>
                        <select id="tamuInstansi" class="w-full rounded-lg border border-stroke bg-transparent py-3 px-4 outline-none transition focus:border-primary cursor-pointer appearance-none">
                            <option value="" disabled selected>Pilih Instansi</option>
                            <option value="Fakultas Teologi">Fakultas Teologi</option>
                            <option value="Fakultas Filsafat">Fakultas Filsafat</option>
                            <option value="Umum / Masyarakat">Umum / Masyarakat</option>
                            <option value="Institusi Lain">Institusi Lain</option>
                        </select>
                    </div>

                    <div class="md:col-span-1">
                        <label class="mb-2 block text-sm font-semibold text-slate-600">Peran/Jabatan</label>
                        <select id="tamuPeran" class="w-full rounded-lg border border-stroke bg-transparent py-3 px-4 outline-none transition focus:border-primary cursor-pointer appearance-none">
                            <option value="" disabled selected>Pilih Peran</option>
                            <option value="Mahasiswa">Mahasiswa</option>
                            <option value="Dosen">Dosen</option>
                            <option value="Staf">Staf</option>
                            <option value="Peneliti">Peneliti</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>

                <!-- View: Member -->
                <div id="viewMember" class="hidden">
                    <label class="mb-2 block text-sm font-semibold text-slate-600">Scan Barcode / Ketik ID Anggota</label>
                    <input type="text" id="memberBarcode" placeholder="Scan Barcode disini..." class="w-full rounded-lg border border-stroke bg-transparent py-3 px-4 outline-none transition focus:border-primary shadow-inner">
                    <p class="text-xs text-slate-500 mt-2"><i class="fa-solid fa-info-circle"></i> Gunakan alat scanner barcode atau ketik ID lalu tekan Enter.</p>
                </div>
                
                <p id="formError" class="text-danger text-sm mt-4 hidden text-center font-bold bg-danger/10 p-2 rounded"></p>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end">
                <button type="submit" id="btnSubmit" class="rounded-lg bg-primary py-3 px-8 text-center font-bold text-white hover:bg-opacity-90 transition shadow-lg w-full md:w-auto flex items-center justify-center">
                    <i class="fa-solid fa-check-circle mr-2"></i> Daftar Kehadiran
                </button>
            </div>
            
        </form>
    </div>

    <!-- Audio Beep -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(success=true) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            if(success) {
                oscillator.frequency.value = 880; 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else {
                oscillator.frequency.value = 300;
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }
    </script>

    <!-- Logic -->
    <script>
        const viewBukanMember = document.getElementById('viewBukanMember');
        const viewMember = document.getElementById('viewMember');
        const inputNama = document.getElementById('tamuNama');
        const inputBarcode = document.getElementById('memberBarcode');
        const err = document.getElementById('formError');
        const toast = document.getElementById('successToast');
        const msg = document.getElementById('successMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        
        let isMemberMode = false;

        function toggleForm() {
            err.classList.add('hidden');
            if (document.getElementById('adalahMember').checked) {
                isMemberMode = true;
                viewBukanMember.classList.add('hidden');
                viewMember.classList.remove('hidden');
                btnSubmit.classList.add('hidden'); // Barcode scanner auto submits usually
                inputBarcode.focus();
            } else {
                isMemberMode = false;
                viewMember.classList.add('hidden');
                viewBukanMember.classList.remove('hidden');
                btnSubmit.classList.remove('hidden');
                inputNama.focus();
            }
        }

        // Initialize focus
        inputNama.focus();

        // Member Barcode Auto Submit
        inputBarcode.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                submitForm();
            }
        });

        function showSuccess(name) {
            playBeep(true);
            msg.innerText = "Selamat Datang, " + name + "!";
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('kioskForm').reset();
                toggleForm(); // restore correct focus based on current radio selection
            }, 3000);
        }

        async function submitForm() {
            err.classList.add('hidden');
            let payload = {};

            if (isMemberMode) {
                const id = inputBarcode.value.trim();
                if (!id) {
                    err.innerText = "Silakan scan barcode terlebih dahulu.";
                    err.classList.remove('hidden');
                    return;
                }
                payload = {
                    tipe_pengunjung: 'Member',
                    identitas: id
                };
            } else {
                const nama = inputNama.value.trim();
                const instansi = document.getElementById('tamuInstansi').value;
                const peran = document.getElementById('tamuPeran').value;
                
                if(!nama || !instansi || !peran) {
                    err.innerText = "Harap lengkapi Nama, Instansi, dan Peran.";
                    err.classList.remove('hidden');
                    return;
                }
                payload = {
                    tipe_pengunjung: 'Non-Member',
                    identitas: nama,
                    asal_instansi: instansi,
                    peran_jabatan: peran
                };
            }
            
            try {
                const res = await fetch('/api/kunjungan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(res.ok) {
                    showSuccess(data.display_name);
                } else {
                    playBeep(false);
                    err.innerText = data.message || "Gagal merekam data.";
                    err.classList.remove('hidden');
                    if(isMemberMode) inputBarcode.select();
                }
            } catch(e) {
                playBeep(false);
                err.innerText = "Terjadi kesalahan jaringan.";
                err.classList.remove('hidden');
            }
        }

        // Autocomplete Logic
        const autocompleteList = document.getElementById('autocompleteList');
        let debounceTimer;

        inputNama.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const val = this.value;
            if(val.length < 3) {
                autocompleteList.classList.add('hidden');
                return;
            }
            debounceTimer = setTimeout(async () => {
                const res = await fetch('/api/kunjungan/autocomplete?q=' + encodeURIComponent(val));
                if(res.ok) {
                    const data = await res.json();
                    autocompleteList.innerHTML = '';
                    if(data.length > 0) {
                        data.forEach(name => {
                            const div = document.createElement('div');
                            div.className = "p-3 hover:bg-gray-100 cursor-pointer border-b border-[#eee] text-sm font-medium text-black last:border-b-0";
                            div.innerHTML = name;
                            div.addEventListener('click', () => {
                                inputNama.value = name;
                                autocompleteList.classList.add('hidden');
                            });
                            autocompleteList.appendChild(div);
                        });
                        autocompleteList.classList.remove('hidden');
                    } else {
                        autocompleteList.classList.add('hidden');
                    }
                }
            }, 300);
        });
        
        document.addEventListener('click', function(e) {
            if(e.target !== inputNama && e.target !== autocompleteList) {
                autocompleteList.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
