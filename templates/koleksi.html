{% extends "layout.html" %}
{% block content %}
<div x-data="koleksiManager()" x-init="loadData()" class="bg-white rounded-lg shadow-sm border border-stroke overflow-hidden">
    <div class="bg-primary px-6 py-4 border-b border-stroke flex justify-between items-center">
        <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-list mr-2"></i> Daftar Koleksi (Bibliografi)</h2>
        <div>
            <a href="/input_buku" class="bg-success hover:bg-opacity-90 text-white px-4 py-2 rounded text-sm font-medium shadow-sm transition"><i class="fa-solid fa-plus mr-1"></i> Tambah Buku Baru</a>
        </div>
    </div>
    
    <div class="p-4 border-b border-stroke bg-slate-50 flex gap-2">
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" x-model="searchQuery" @input.debounce.500ms="loadData(1)" class="w-full border border-stroke rounded pl-10 pr-3 py-2 outline-none focus:border-primary text-black" placeholder="Cari Judul, Pengarang, atau DDC...">
        </div>
    </div>

    <div class="overflow-x-auto relative">
        <!-- Loader -->
        <div x-show="isLoading" class="absolute inset-0 bg-white/50 flex items-center justify-center z-10">
            <div class="text-primary text-xl"><i class="fa-solid fa-spinner fa-spin"></i></div>
        </div>

        <table class="w-full text-left text-sm border-collapse">
            <thead>
                <tr class="bg-slate-100 border-b border-stroke text-black">
                    <th class="p-3">Judul Buku</th>
                    <th class="p-3 w-48">Pengarang</th>
                    <th class="p-3 w-32">Penerbit</th>
                    <th class="p-3 w-24">DDC</th>
                    <th class="p-3 w-32 text-center">Jml Salinan</th>
                    <th class="p-3 w-16"></th>
                </tr>
            </thead>
            <template x-for="b in bibliografi" :key="b.id">
                    <tbody class="hover:bg-slate-50 transition">
                        <tr class="border-b border-stroke cursor-pointer" @click="toggleEksemplar(b.id)">
                            <td class="p-3">
    <div class="flex items-start gap-3">
        <div class="w-10 h-14 bg-slate-100 border border-slate-200 rounded flex-shrink-0 flex justify-center items-center overflow-hidden">
            <template x-if="b.cover_url">
                <img :src="b.cover_url" class="w-full h-full object-cover" @error="b.cover_url = null" alt="cover">
            </template>
            <template x-if="!b.cover_url">
                <i class="fa-solid fa-book text-slate-300 text-lg"></i>
            </template>
        </div>
        <div>
            <div class="font-semibold text-primary leading-tight" x-text="b.judul"></div>
            <div class="text-xs text-slate-400 mt-1" x-show="b.isbn" x-text="'ISBN: ' + b.isbn"></div>
        </div>
    </div>
</td>
                            <td class="p-3 text-slate-600" x-text="b.pengarang || '-'"></td>
                            <td class="p-3 text-slate-600" x-text="b.penerbit || '-'"></td>
                            <td class="p-3 font-mono text-slate-600" x-text="b.klasifikasi || '-'"></td>
                            <td class="p-3 text-center">
                                <span class="bg-slate-200 text-black px-2 py-0.5 rounded-full text-xs font-bold" x-text="b.jumlah_eksemplar"></span>
                            </td>
                            <td class="p-3 text-center text-slate-400">
                                <i class="fa-solid" :class="expandedId === b.id ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                            </td>
                        </tr>
                        <!-- Eksemplar Row -->
                        <tr x-show="expandedId === b.id" class="bg-slate-50 border-b border-stroke">
                            <td colspan="6" class="p-4">
                                <div class="bg-white border border-stroke rounded shadow-sm p-4">
                                    
                                    <div class="flex justify-between items-center mb-3">
                                        <h4 class="font-semibold text-sm text-slate-700">Daftar Barcode (Salinan)</h4>
                                        <div class="flex gap-2">
                                            <a :href="'/input_buku?edit=' + b.id" class="px-3 py-1 bg-warning text-white text-xs rounded font-medium hover:bg-opacity-90 transition"><i class="fa-solid fa-pen-to-square"></i> Edit Bibliografi</a>
                                            <button @click.stop="deleteBiblio(b.id)" class="px-3 py-1 bg-danger text-white text-xs rounded font-medium hover:bg-opacity-90 transition"><i class="fa-solid fa-trash"></i> Hapus Buku</button>
                                        </div>
                                    </div>

                                    
                                    <div x-show="isLoadingEksemplar" class="text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</div>
                                    
                                    <table x-show="!isLoadingEksemplar" class="w-full text-left text-sm border">
                                        <thead>
                                            <tr class="bg-slate-100 border-b text-black">
                                                <th class="p-2 border-r">No Induk (Barcode)</th>
                                                <th class="p-2 border-r">Lokasi</th>
                                                <th class="p-2 border-r">Asal</th>
                                                <th class="p-2">Status Peminjaman</th>
<th class="p-2 text-center w-10">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="e in eksemplarList">
                                                <tr class="border-b hover:bg-slate-50">
                                                    <td class="p-2 border-r font-mono font-bold" x-text="e.no_induk"></td>
                                                    <td class="p-2 border-r" x-text="e.lokasi"></td>
                                                    <td class="p-2 border-r" x-text="e.status_buku"></td>
                                                    <td class="p-2">
                                                        <span x-show="e.status_buku === 'DIPINJAM'" class="text-danger font-bold text-xs"><i class="fa-solid fa-user-clock"></i> DIPINJAM</span>
                                                        <span x-show="e.status_buku !== 'DIPINJAM'" class="text-success font-bold text-xs"><i class="fa-solid fa-check"></i> TERSEDIA</span>
                                                    </td>

                                                    <td class="p-2 text-center">
                                                        <button @click.stop="deleteEksemplar(e.no_induk)" class="text-danger hover:text-opacity-70" title="Hapus Salinan"><i class="fa-solid fa-trash-can"></i></button>
                                                    </td>
                                                </tr>
                                            </template>
                                            <tr x-show="eksemplarList.length === 0">
                                                <td colspan="5" class="p-3 text-center text-slate-500 text-xs">Belum ada salinan untuk buku ini.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </template>
            <tbody>
                <tr x-show="bibliografi.length === 0 && !isLoading">
                    <td colspan="6" class="p-8 text-center text-slate-500">
                        Tidak ada koleksi buku yang ditemukan.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="p-4 border-t border-stroke flex justify-between items-center bg-slate-50">
        <div class="text-sm text-slate-500">
            Total <strong x-text="totalData"></strong> judul buku
        </div>
        <div class="flex gap-1">
            <button @click="loadData(currentPage - 1)" :disabled="currentPage === 1" class="px-3 py-1 border border-stroke rounded bg-white hover:bg-slate-100 disabled:opacity-50">Prev</button>
            <span class="px-3 py-1 text-sm pt-1.5" x-text="'Hal ' + currentPage + ' dari ' + totalPages"></span>
            <button @click="loadData(currentPage + 1)" :disabled="currentPage === totalPages || totalPages === 0" class="px-3 py-1 border border-stroke rounded bg-white hover:bg-slate-100 disabled:opacity-50">Next</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('koleksiManager', () => ({
        searchQuery: '',
        bibliografi: [],
        totalData: 0,
        currentPage: 1,
        totalPages: 1,
        isLoading: false,
        
        expandedId: null,
        eksemplarList: [],
        isLoadingEksemplar: false,
        
        autoCover: {
            active: false,
            processed: 0,
            total: 0,
            currentTitle: '',
        },
        
        async startRobot() {
            if(!confirm("Robot ini akan mencari sampul buku di internet satu-per-satu. Proses ini membutuhkan waktu (sekitar 1 detik per buku). Biarkan halaman ini tetap terbuka selama robot bekerja.\n\nJalankan robot sekarang?")) return;
            
            this.autoCover.active = true;
            this.autoCover.processed = 0;
            
            while(this.autoCover.active) {
                // Get batch of 50
                const res = await fetch('/api/buku/missing_covers');
                const books = await res.json();
                if(books.length === 0) {
                    alert("Hore! Semua buku (yang bisa dicari) sudah diproses!");
                    this.autoCover.active = false;
                    break;
                }
                
                this.autoCover.total = books.length;
                this.autoCover.processed = 0;
                
                for(let b of books) {
                    if(!this.autoCover.active) break;
                    this.autoCover.currentTitle = b.judul;
                    
                    try {
                        const q = "intitle:" + b.judul + (b.pengarang ? "+inauthor:" + b.pengarang : "");
                        const gRes = await fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(q));
                        if(gRes.ok) {
                            const gData = await gRes.json();
                            if(gData.items && gData.items.length > 0) {
                                let img = gData.items[0].volumeInfo?.imageLinks?.thumbnail;
                                if(img) {
                                    img = img.replace("http:", "https:");
                                    await fetch('/api/buku/save_cover', {
                                        method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({id: b.id, url: img})
                                    });
                                } else {
                                    await fetch('/api/buku/save_cover', {
                                        method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({id: b.id, url: 'NOT_FOUND'})
                                    });
                                }
                            } else {
                                await fetch('/api/buku/save_cover', {
                                    method: 'POST', headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({id: b.id, url: 'NOT_FOUND'})
                                });
                            }
                        } else {
                            await fetch('/api/buku/save_cover', {
                                method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({id: b.id, url: 'NOT_FOUND'})
                            });
                        }
                            }
                        }
                    } catch(e) {
                        console.error(e);
                    }
                    this.autoCover.processed++;
                    // sleep 1 second
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                // Refresh list if robot finished a batch
                this.loadBibliografi();
            }
        },
        
        stopRobot() {
            this.autoCover.active = false;
        },
        
        
        async deleteBiblio(id) {
            if (!confirm("Peringatan: Anda akan menghapus judul buku ini BESERTA seluruh salinannya! Lanjutkan?")) return;
            try {
                const res = await fetch('/api/bibliografi/' + id, { method: 'DELETE', credentials: 'same-origin' });
                if (res.status === 401) { alert('Sesi habis! Silakan refresh halaman dan coba lagi.'); return; }
                if (!res.ok) { const txt = await res.text(); console.error(txt); alert('Server Error ' + res.status + ': Silakan cek console browser (F12) untuk detailnya.'); return; }
                const data = await res.json();
                if (data.status === 'success') {
                    this.expandedId = null;
                    this.loadData(this.currentPage);
                } else {
                    alert('Gagal: ' + (data.message || res.status));
                }
            } catch (e) {
                console.error(e); alert("Error: " + e.message);
            }
        },
        async deleteEksemplar(no_induk) {
            if (!confirm("Hapus barcode " + no_induk + "?")) return;
            try {
                const res = await fetch('/api/eksemplar/' + encodeURIComponent(no_induk), { method: 'DELETE', credentials: 'same-origin' });
                if (res.status === 401) { alert('Sesi habis! Silakan refresh halaman dan coba lagi.'); return; }
                if (!res.ok) { const txt = await res.text(); console.error(txt); alert('Server Error ' + res.status + ': Silakan cek console browser (F12) untuk detailnya.'); return; }
                const data = await res.json();
                if (data.status === 'success') {
                    const bid = this.expandedId;
                    this.expandedId = null;
                    this.eksemplarList = [];
                    await this.toggleEksemplar(bid);
                    this.loadData(this.currentPage);
                } else {
                    alert('Gagal: ' + (data.message || res.status));
                }
            } catch (e) {
                console.error(e); alert("Error: " + e.message);
            }
        },

        async loadData(page = 1) {
            this.isLoading = true;
            this.currentPage = page;
            this.expandedId = null;
            try {
                const res = await fetch('/api/koleksi/list?search=' + encodeURIComponent(this.searchQuery) + '&page=' + page);
                const data = await res.json();
                this.bibliografi = data.data;
                this.totalData = data.total;
                this.totalPages = data.total_pages;
            } catch (e) {
                console.error(e); alert("API Error: " + (e.message || e));
            }
            this.isLoading = false;
        },
        
        async toggleEksemplar(id) {
            if (this.expandedId === id) {
                this.expandedId = null;
                return;
            }
            this.expandedId = id;
            this.eksemplarList = [];
            this.isLoadingEksemplar = true;
            try {
                const res = await fetch('/api/koleksi/eksemplar/' + id);
                this.eksemplarList = await res.json();
            } catch (e) {
                console.error(e); alert("API Error: " + (e.message || e));
            }
            this.isLoadingEksemplar = false;
        }
    }));
});
</script>
{% endblock %}
